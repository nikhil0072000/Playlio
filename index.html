<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>%UNITY_DISPLAY_NAME%</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1f1f1f;
        }
        body {
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        #unity-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #unity-canvas {
            display: block;
            background: #1f1f1f;
        }
        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
        #unity-logo {
            width: 154px;
            height: 130px;
            background: url('data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNTQiIGhlaWdodD0iMTMwIj4KPHBhdGggZmlsbD0iIzhhOGE4YSIgZD0iTTc4LjggNTAuM0wyOSAxMTdoODcuOGwxMy45LTI0SDc4Ljh6TTgwLjQgNDguNUw1My42IDBoMjkuOWwxMS41IDI0Ljl6TTk1IDIuN0w2OCAxMDUuMiA0MC4yIDIuN0g1OXY2Mi42bDgtMTguMSA5IDE4LjF6TTEwOC4xIDQ0LjJMMTQwLjYgMTE3aC0yMnpsMy45LTI3LjIgOC4xLTE4LjEgNy41IDE2LjJ6Ii8+CjxwYXRoIGZpbGw9IiM4YThhOGEiIGQ9Ik0xMTguNCA2NS41bC0yIDMuMi01LjggMTEuMS01LjkgMTkuNS0yLjIgNS43IDUuNS0xMCAxMS42LTIxLjIgMS4yLTIuNXoiLz4KPC9zdmc+Cg==') no-repeat center;
            background-size: contain;
        }
        #unity-progress-bar-empty {
            width: 141px;
            height: 18px;
            margin-top: 10px;
            background: url('data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNDEiIGhlaWdodD0iMTgiPjxyZWN0IHdpZHRoPSIxNDEiIGhlaWdodD0iMTgiIGZpbGw9IiNmZmYiIGZpbGwtcnVsZT0iZXZlbm9kZCIgcng9IjkvIi8+PC9zdmc+Cg==') no-repeat center;
            background-size: contain;
        }
        #unity-progress-bar-full {
            width: 0%;
            height: 18px;
            margin-top: 10px;
            background: url('data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNDEiIGhlaWdodD0iMTgiPjxyZWN0IHdpZHRoPSIxNDEiIGhlaWdodD0iMTgiIGZpbGw9IiNlNTcwMDAiIGZpbGwtcnVsZT0iZXZlbm9kZCIgcng9IjkvIi8+PC9zdmc+Cg==') no-repeat center;
            background-size: contain;
        }
        #unity-warning {
            position: absolute;
            left: 50%;
            top: 5%;
            transform: translate(-50%);
            background: white;
            padding: 10px;
            display: none;
        }
        #unity-fullscreen-button {
            position: absolute;
            right: 10px;
            bottom: 10px;
            width: 38px;
            height: 38px;
            border: none;
            background: transparent;
            cursor: pointer;
            color: #fff;
            font-size: 24px;
            display: none;
        }
        @media (prefers-color-scheme: dark) {
            #unity-warning { color: #1f1f1f; }
        }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1" width="%UNITY_WIDTH%" height="%UNITY_HEIGHT%"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <button id="unity-fullscreen-button" aria-label="Fullscreen" title="Fullscreen">&#x26F6;</button>
    </div>
    <script src="%UNITY_LOADER_URL%"></script>
    <script>
        var buildUrl = "%UNITY_WEB_NAME%";
        var config = {
            dataUrl: buildUrl + "/%UNITY_DATA_FILE%",
            frameworkUrl: buildUrl + "/%UNITY_FRAMEWORK_FILE%",
            codeUrl: buildUrl + "/%UNITY_CODE_FILE%",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "%UNITY_COMPANY_NAME%",
            productName: "%UNITY_DISPLAY_NAME%",
            productVersion: "%UNITY_VERSION%",
            showBanner: unityShowBanner
        };

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");

        var gameAspect = %UNITY_WIDTH% / %UNITY_HEIGHT%;

        function setCanvasToFit() {
            var viewportWidth = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
            var viewportHeight = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
            var height = viewportHeight;
            var width = height * gameAspect;
            if (width > viewportWidth) {
                width = viewportWidth;
                height = width / gameAspect;
            }
            canvas.style.width = Math.floor(width) + "px";
            canvas.style.height = Math.floor(height) + "px";
        }

        window.addEventListener("resize", setCanvasToFit);

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? "block" : "none";
            }
            var div = document.createElement("div");
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == "error") div.style = "border: 1px solid red; border-radius: 4px;";
            else div.style = "border: 1px solid black; border-radius: 4px;";
            if (type == "error") warningBanner.style = "border: 1px solid red; border-radius: 8px; ";
            else warningBanner.style = "border: 1px solid black; border-radius: 8px; ";
            updateBannerVisibility();
            setTimeout(function () {
                if (warningBanner.children.length == 1) {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }
            }, 5000);
        }

        var progressInterval = setInterval(function () {
            var match = /[0-9]+%/.exec(progressBarFull.style.width);
            if (match) loadingBar.style.display = "block";
        }, 1000);

        createUnityInstance(canvas, config, function (progress) {
            progressBarFull.style.width = progress * 100 + "%";
        }).then(function (unityInstance) {
            loadingBar.style.display = "none";
            fullscreenButton.onclick = function () {
                unityInstance.SetFullscreen(1);
            };
            fullscreenButton.style.display = "block";
            progressInterval = null;
            setCanvasToFit();
        }).catch(function (message) {
            alert(message);
        });
    </script>
  </body>
</html>
